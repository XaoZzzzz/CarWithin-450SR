name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Inject MFi identity (from repo secrets, not committed)
        env:
          MFI_CERT_P7B: ${{ secrets.MFI_CERT_P7B }}
          MFI_LEAF_CER: ${{ secrets.MFI_LEAF_CER }}
          MFI_PRIVATE_X963: ${{ secrets.MFI_PRIVATE_X963 }}
        run: |
          mkdir -p App/BundledIdentity
          if [ -n "$MFI_CERT_P7B" ]; then
            printf '%s' "$MFI_CERT_P7B" | base64 --decode > App/BundledIdentity/certificate.p7b
            printf '%s' "$MFI_LEAF_CER" | base64 --decode > App/BundledIdentity/leaf.cer
            printf '%s' "$MFI_PRIVATE_X963" | base64 --decode > App/BundledIdentity/private.x963
            echo "MFi identity injected: $(ls -l App/BundledIdentity | wc -l | tr -d ' ') entries"
          else
            echo "No MFI secrets configured — building without bundled identity"
          fi

      - name: Generate project
        run: python3 Tools/generate_project.py

      - name: Build
        run: |
          set +e
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp build.log ci-build-log.txt
            git config user.name "CarWithin-450SR builder"
            git config user.email "builder@users.noreply.github.com"
            git add -f ci-build-log.txt
            git commit -m "CI build log [skip ci]" || true
            git push || true
          fi
          exit $status

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/TDSCarKit.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CarWithin-450SR-unsigned.ipa Payload
          ls -lh CarWithin-450SR-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CarWithin-450SR-unsigned-ipa
          path: CarWithin-450SR-unsigned.ipa
